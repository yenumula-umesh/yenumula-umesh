name: Update Profile HUD

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: profile-hud-update
  cancel-in-progress: true

jobs:
  update-hud:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Generate live HUD
        run: |
          python scripts/generate_hud.py

      - name: Create or update hero-live.png
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          REPO="${{ github.repository }}"
          FILE="hero-live.png"

          CONTENT=$(base64 -w 0 "$FILE")

          FILE_SHA=$(gh api \
            "repos/$REPO/contents/$FILE?ref=main" \
            --jq '.sha' 2>/dev/null || true)

          if [ -n "$FILE_SHA" ]; then
            echo "hero-live.png exists. Updating it..."

            gh api \
              --method PUT \
              "repos/$REPO/contents/$FILE" \
              -f message="Update profile HUD" \
              -f content="$CONTENT" \
              -f sha="$FILE_SHA" \
              -f branch="main"

          else
            echo "hero-live.png does not exist. Creating it..."

            gh api \
              --method PUT \
              "repos/$REPO/contents/$FILE" \
              -f message="Create profile HUD" \
              -f content="$CONTENT" \
              -f branch="main"
          fi

          echo "hero-live.png successfully created/updated."
