name: Update Profile HUD

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: profile-hud
  cancel-in-progress: true

jobs:
  update-hud:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Generate hero-live.png
        run: |
          python scripts/generate_hud.py

      - name: Upload hero-live.png
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]

          file_path = "hero-live.png"
          api_url = f"https://api.github.com/repos/{repo}/contents/{file_path}"

          with open(file_path, "rb") as file:
              content = base64.b64encode(file.read()).decode("ascii")

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "umesh-profile-hud",
              "Content-Type": "application/json",
          }

          # Check whether the file already exists.
          sha = None

          request = urllib.request.Request(
              api_url + "?ref=main",
              headers=headers,
              method="GET",
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  existing = json.loads(response.read().decode("utf-8"))
                  sha = existing.get("sha")
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise

          payload = {
              "message": "Update profile HUD",
              "content": content,
              "branch": "main",
          }

          if sha:
              payload["sha"] = sha
              print("Updating existing hero-live.png")
          else:
              print("Creating new hero-live.png")

          body = json.dumps(payload).encode("utf-8")

          request = urllib.request.Request(
              api_url,
              data=body,
              headers=headers,
              method="PUT",
          )

          with urllib.request.urlopen(request, timeout=120) as response:
              result = json.loads(response.read().decode("utf-8"))

          print("hero-live.png successfully uploaded.")
          print("Commit:", result["commit"]["sha"])
          PY
