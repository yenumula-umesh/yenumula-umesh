name: Update Profile HUD

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: profile-hud-update
  cancel-in-progress: true

jobs:
  update-hud:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Generate live HUD
        run: |
          python scripts/generate_hud.py

      - name: Update hero-live.png through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          REPO="${{ github.repository }}"
          FILE="hero-live.png"

          for attempt in 1 2 3 4 5
          do
            echo "===== API UPDATE ATTEMPT $attempt ====="

            FILE_SHA=$(gh api \
              "repos/$REPO/contents/$FILE?ref=main" \
              --jq '.sha')

            echo "Current remote file SHA: $FILE_SHA"

            CONTENT=$(base64 -w 0 "$FILE")

            if gh api \
              --method PUT \
              "repos/$REPO/contents/$FILE" \
              -f message="Update profile HUD" \
              -f content="$CONTENT" \
              -f sha="$FILE_SHA" \
              -f branch="main"
            then
              echo "hero-live.png updated successfully."
              exit 0
            fi

            echo "Remote file changed. Retrying..."
            sleep 5
          done

          echo "Failed to update hero-live.png after 5 attempts."
          exit 1
