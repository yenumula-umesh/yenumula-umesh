name: Update Profile HUD

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: profile-hud-update
  cancel-in-progress: true

jobs:
  update-hud:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Sync with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Generate live HUD
        run: |
          python scripts/generate_hud.py

      - name: Commit and push HUD
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5
          do
            echo "===== PUSH ATTEMPT $attempt ====="

            git fetch origin main
            git reset --hard origin/main

            python scripts/generate_hud.py

            git add hero-live.png

            if git diff --cached --quiet
            then
              echo "No changes to hero-live.png"
              exit 0
            fi

            git commit -m "Update profile HUD"

            if git push origin HEAD:main
            then
              echo "HUD update pushed successfully."
              exit 0
            fi

            echo "Push rejected. Retrying..."
            sleep 5
          done

          echo "ERROR: Could not push HUD update."
          exit 1
