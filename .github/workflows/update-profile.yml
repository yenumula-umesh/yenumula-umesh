name: Update Profile HUD

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Prevent two HUD updates from running at the same time.
concurrency:
  group: profile-hud-update
  cancel-in-progress: true

jobs:
  update-hud:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Generate live profile image
        run: |
          python scripts/generate_hud.py

      - name: Commit and push updated HUD
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add hero-live.png

          if git diff --cached --quiet; then
            echo "No changes to hero-live.png"
            exit 0
          fi

          git commit -m "Update profile HUD"

          # Retry the push in case main changes while the workflow is running.
          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt"

            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "HUD update pushed successfully."
                exit 0
              fi
            else
              echo "Rebase failed. Aborting rebase."
              git rebase --abort || true
            fi

            echo "Push failed. Waiting before retry..."
            sleep 5
          done

          echo "Could not push HUD update after 5 attempts."
          exit 1
