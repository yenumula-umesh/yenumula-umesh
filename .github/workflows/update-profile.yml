name: Update Profile HUD

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: profile-hud
  cancel-in-progress: true

jobs:
  update-hud:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate HUD
        run: python scripts/generate_hud.py

      - name: Commit HUD
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add hero-live.png

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Update profile HUD"

      - name: Push HUD safely
        run: |
          for i in 1 2 3 4 5; do
            echo "Push attempt $i"

            git fetch origin main

            REMOTE_SHA=$(git rev-parse origin/main)

            git rebase origin/main || {
              git rebase --abort || true
              git reset --hard origin/main
              python scripts/generate_hud.py
              git add hero-live.png
              git commit -m "Update profile HUD" || true
            }

            if git push --force-with-lease=refs/heads/main:$REMOTE_SHA origin HEAD:main; then
              echo "HUD pushed successfully."
              exit 0
            fi

            echo "Push failed. Retrying..."
            sleep 5
          done

          echo "Failed to push HUD after 5 attempts."
          exit 1
